require:
  - ./rules/my_scope/no_comments

MyScope/NoComments:
  Enabled: true
  AllowedPatterns:
    - '^NOTE: '

match-segment:
  - Pattern: wef
    Exclude:
      - '*_wef.yml'

match-segment-to-source:
  - Pattern: '\[[A-Z_]+\]'
    Exclude:
      - '*ignore_brackets_comparison.yml'

match-file:
  - Pattern: German
    CaseSensitive: false
    Exclude:
      - '*de.yml'

ThisWillNotBe/Used:
  Enabled: true
